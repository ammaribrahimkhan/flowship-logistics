<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152459"/>
      <stop offset="1" stop-color="#0A1330"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2158FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2158FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#C7D0EA"/>
    </linearGradient>
  </defs>

  <rect width="720" height="620" fill="url(#sky)"/>
  <circle cx="560" cy="120" r="220" fill="url(#glow)"/>

  <!-- distant skyline -->
  <g opacity="0.35" fill="#2A3A72">
    <rect x="40" y="330" width="30" height="90"/>
    <rect x="80" y="300" width="24" height="120"/>
    <rect x="112" y="345" width="34" height="75"/>
    <rect x="600" y="310" width="26" height="110"/>
    <rect x="634" y="340" width="30" height="80"/>
  </g>

  <!-- road -->
  <rect x="0" y="420" width="720" height="200" fill="#0D1A3D"/>
  <rect x="0" y="420" width="720" height="6" fill="#1B2C5E"/>
  <g stroke="#3E51A0" stroke-width="6" stroke-dasharray="34 26" opacity="0.7">
    <line x1="0" y1="480" x2="720" y2="480"/>
  </g>
  <g stroke="#2158FF" stroke-width="3" stroke-dasharray="14 12" opacity="0.9">
    <line x1="0" y1="480" x2="720" y2="480">
      <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- truck group -->
  <g transform="translate(120,330)">
    <!-- shadow -->
    <ellipse cx="230" cy="182" rx="230" ry="18" fill="#000" opacity="0.35"/>

    <!-- trailer -->
    <rect x="0" y="20" width="300" height="130" rx="10" fill="#EEF3FF"/>
    <rect x="0" y="20" width="300" height="130" rx="10" fill="none" stroke="#C7D0EA" stroke-width="2"/>
    <rect x="18" y="42" width="264" height="10" fill="#2158FF" opacity="0.85"/>
    <text x="150" y="100" text-anchor="middle" font-family="Oswald, sans-serif" font-size="30" fill="#0A1330" letter-spacing="2">FLOWSHIP</text>

    <!-- cab -->
    <path d="M300 150 L300 60 Q300 40 322 40 L372 40 Q392 40 404 58 L432 100 L432 150 Z" fill="url(#cab)"/>
    <path d="M322 55 L322 95 L392 95 L370 55 Z" fill="#0A1330" opacity="0.85"/>
    <rect x="300" y="110" width="132" height="10" fill="#2158FF"/>

    <!-- wheels -->
    <circle cx="70" cy="160" r="30" fill="#0A1330"/>
    <circle cx="70" cy="160" r="13" fill="#EEF3FF"/>
    <circle cx="200" cy="160" r="30" fill="#0A1330"/>
    <circle cx="200" cy="160" r="13" fill="#EEF3FF"/>
    <circle cx="390" cy="160" r="30" fill="#0A1330"/>
    <circle cx="390" cy="160" r="13" fill="#EEF3FF"/>

    <!-- headlight beam -->
    <polygon points="432,110 500,80 500,150" fill="#FFD98E" opacity="0.25"/>
  </g>

  <!-- speed lines -->
  <g stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="20" y1="440" x2="90" y2="440"/>
    <line x1="10" y1="460" x2="60" y2="460"/>
  </g>
</svg>
